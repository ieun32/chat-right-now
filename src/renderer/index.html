<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https: wss: ws:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self';" />
  <title>ChatRightNow</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="play-area"><canvas id="stage" tabindex="-1"></canvas></div>
  <div id="inventory" class="hidden" role="group" aria-label="무기 선택">
    <div class="inventory-ring"></div>
    <button class="weapon-slot" data-weapon="club" aria-label="도깨비방망이"><canvas width="64" height="64"></canvas><span>도깨비방망이 · 1</span></button>
    <button class="weapon-slot" data-weapon="gun" aria-label="총"><canvas width="64" height="64"></canvas><span>총 · 2</span></button>
    <button class="weapon-slot" data-weapon="flame" aria-label="화염방사기"><canvas width="64" height="64"></canvas><span>화염방사기 · 3</span></button>
  </div>
  <div id="hud" class="dock hidden">
    <div id="hud-menu" class="dock-menu" aria-label="설정">
      <div class="menu-head"><span id="hud-room"></span><span id="hud-online" class="muted"></span></div>
      <label class="size"><span>캐릭터</span><input id="hud-size" aria-label="캐릭터 크기" type="range" min="0.4" max="3" step="0.1" value="1" /><span id="hud-size-val">1.0×</span></label>
      <label id="tower-size-control" class="size hidden"><span>맵 크기</span><input id="tower-size" type="range" min="0.7" max="1.5" step="0.05" value="1" aria-label="인내의 숲 맵 크기" /></label>
      <button id="hud-hide" title="숨기기 (Esc) · 숨김/표시 (Ctrl+Alt+H)">숨기기 <span class="muted">Esc</span></button>
      <button id="hud-leave">방 나가기</button>
      <details id="hud-more"><summary>더 보기</summary>
        <p class="hint muted">Enter 채팅 · 방향키/WASD 이동<br>Shift 달리기 · Space 점프<br>E 무기 선택 · F 공격 · 1/2/3 무기<br>인내의 숲: Tab 랭킹<br>Esc 숨김 · Ctrl+Alt+H 숨김/표시</p>
        <div class="update-panel"><span data-app-version></span><span data-update-status role="status"></span><button data-update-action>업데이트 확인</button></div>
        <button id="hud-quit" title="종료 (Ctrl+Alt+Q)">앱 종료</button>
      </details>
    </div>
    <button id="hud-toggle" class="dock-fab" title="설정" aria-label="설정 메뉴" aria-expanded="false" aria-controls="hud-menu">···</button>
  </div>
  <div id="tower-hud" class="hidden"><span id="tower-floor">0층</span><span id="tower-weapon" class="hidden">도깨비방망이</span></div>
  <div id="tower-rank" class="hidden" role="status" aria-label="실시간 랭킹">
    <div class="rank-head"><strong>랭킹</strong><span id="tower-rank-total" class="muted"></span></div><ol id="tower-rank-list"></ol>
  </div>
  <form id="chatbar" class="hidden" autocomplete="off"><input id="chat-input" aria-label="채팅 메시지" maxlength="200" placeholder="메시지 입력 후 Enter…" /></form>
  <div id="join" class="overlay">
    <div class="card">
      <header><h1>ChatRightNow</h1><button id="join-close" type="button" title="종료 (Ctrl+Alt+Q)" aria-label="종료">×</button></header>
      <div class="profile-row">
        <label for="nick">닉네임</label><input id="nick" maxlength="16" placeholder="guest" />
        <details id="animal-picker"><summary aria-label="캐릭터 선택" title="캐릭터 선택"><canvas id="animal-preview" width="64" height="64"></canvas></summary><div id="animals" class="animals"></div></details>
      </div>
      <div class="room-row"><label id="room-label" for="room">방 코드</label><input id="room" maxlength="24" placeholder="FROG-42" /><button id="dice" type="button" title="랜덤 코드" aria-label="랜덤 방 코드">↻</button></div>
      <label class="mode-toggle"><input id="tower-mode" type="checkbox" /><span>인내의 숲</span><span class="muted">점프맵</span></label>
      <button id="enter" class="primary">입장</button>
      <p id="join-error" class="error" role="status"></p>
      <details id="join-more"><summary>설정 및 도움말</summary>
        <p class="hint muted">같은 방 코드로 접속하면 함께할 수 있어요.</p>
        <p id="tower-hint" class="hint muted hidden">같은 코드 = 같은 탑. ←→ 이동 · Space 점프 · F 공격 · Tab 랭킹</p>
        <div class="update-panel"><span data-app-version></span><span data-update-status role="status"></span><button data-update-action>업데이트 확인</button></div>
      </details>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
